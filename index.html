<html lang="zh-Hant">

<link rel="stylesheet" href="style.css?v=difficulty-balance-2">
<main>

 <div class="caption">深夜食堂 / 一人一鍋 / 慢火慢聚</div>
 <canvas id="pot" aria-label="拖曳紅油，慢慢靠近其他油滴使它們合併"></canvas>
 <canvas id="pot-three" aria-label="Three.js 立體火鍋，拖曳紅油使它們合併" hidden></canvas>
 <div class="render-switch" role="group" aria-label="畫面模式"><button id="use-canvas" aria-pressed="true">Canvas 2D</button><button id="use-three" aria-pressed="false">Three.js 3D</button><span id="render-status" role="status">平面手繪</span></div>
 <div class="difficulty-switch" role="group" aria-label="難度"><span>難度</span><button id="difficulty-easy" aria-pressed="true">輕鬆</button><button id="difficulty-hard" aria-pressed="false">挑戰</button><span id="difficulty-note" role="status">輕鬆：原本手感，自在聚油</span></div>
 <section class="intro" id="intro"><span class="eyebrow">一鍋紅油，一點耐心。</span><h1>今晚，聚一鍋。</h1><p>按住紅油，慢慢靠向另一片。<br>手太快，暖意就散了。</p><button class="primary" id="start">開鍋 <span>↗</span></button><small>20 秒挑戰 · 滑鼠與觸控皆可遊玩</small></section>

 <footer><span id="hint" role="status">越慢，越有滋味。</span><button id="reset" hidden>重新開鍋 ↻</button><span class="edition">TAIPEI · NIGHT 01</span></footer>
